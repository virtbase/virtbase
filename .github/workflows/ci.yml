name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `apps/web/src/env.ts` and `packages/auth/env.ts` both skip t3-env validation
  # when CI is set, so no application secrets are needed for these jobs.
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun commitlint --from "$FROM" --to "$TO" --verbose

  check:
    name: Lint, types and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-bun
        with:
          remote-cache: "true"

      - name: Lint
        run: bun check:ci

      - name: Comments on changed lines
        if: github.event_name == 'pull_request'
        run: bun run --silent comment:check HEAD^1

      - name: Typecheck
        run: bun typecheck

      # `--output-type err` prints violations only, so the green tick is the
      # whole message a reader takes away - including when the cruise ran half
      # blind. dependency-cruiser needs a `typescript` it can load (>=2 <7);
      # without one it skips every `.ts` file and reports a clean graph.
      # `tooling/boundaries` pins one. Treat the warning as a failure in case
      # that ever regresses.
      - name: Architecture boundaries
        run: |
          set -o pipefail
          bun check:boundaries 2>&1 | tee "$RUNNER_TEMP/boundaries.log"
          if grep -q 'missing-typescript-transpiler' "$RUNNER_TEMP/boundaries.log"; then
            echo "::error title=dependency-cruiser ran degraded::No TypeScript compiler in the range dependency-cruiser supports (>=2.0.0 <7.0.0), so type-only imports were not resolved. The layer rules above proved nothing. See tooling/boundaries/README.md."
            exit 1
          fi

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          remote-cache: "true"

      # No database service: `createTestDb()` is PGlite, an in-process Postgres.
      # Placeholder env comes from the committed `.env.test`.
      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Check coverage thresholds
        if: ${{ !cancelled() }}
        shell: bash
        run: bun run --silent coverage:check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            tooling/*/coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          remote-cache: "true"

      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/web/next.config.ts') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/web/next.config.ts') }}-

      # Every package script reads its configuration through
      # `bun --env-file ../../.env`, and `.env` is not committed. The values
      # below are placeholders and none of them is reachable: t3-env validation
      # is skipped under CI, but `packages/db/src/client.ts` throws at module
      # evaluation when DATABASE_URL is merely *unset*, and page data collection
      # imports it. CONFIG_ENCRYPTION_KEY is left out on purpose - without it
      # the registry falls back to DisabledConfigSource and every integration
      # reports as disabled, so no third-party credentials are needed.
      - name: Write the environment file
        run: |
          cat > .env <<'ENVFILE'
          DATABASE_URL=postgresql://postgres:password@db.localtest.me:5432/virtbase
          NEXT_PUBLIC_APP_NAME=Virtbase
          NEXT_PUBLIC_APP_DOMAIN=virtbase.com
          BETTER_AUTH_SECRET=ci-only-secret-not-used-outside-ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_00000000000000000000000000
          ENVFILE

      # The web app is built on its own and stops after bundling.
      #
      # A full `next build` ends in a prerender pass that evaluates pages, and
      # several of them read the database - through the Neon serverless
      # protocol, which needs the proxy `docker-compose.yml` runs plus TLS in
      # front of it, and `packages/db/src/client.ts` only routes to that proxy
      # while NODE_ENV is development, which `next build` never is. Prerender is
      # therefore left to Vercel and to `e2e.yml`, which runs the real stack.
      #
      # `--experimental-build-mode compile` still runs Turbopack over every
      # route, so it catches broken imports, server/client boundary mistakes,
      # MDX that will not compile and message extraction - none of which any
      # other job runs. It skips the TypeScript pass, which `bun typecheck` in
      # the check job covers (`next typegen && tsc --noEmit`, same sources).
      - name: Compile the web app
        working-directory: apps/web
        run: bun run with-env next build --experimental-build-mode compile

      - name: Translation catalogs are committed
        run: |
          if [ -n "$(git status --porcelain -- apps/web/src/i18n/messages)" ]; then
            git status --short -- apps/web/src/i18n/messages
            echo "::error title=Stale translation catalogs::The build extracted messages that are not committed. Run the web app locally and commit apps/web/src/i18n/messages."
            exit 1
          fi

      - name: Save the Next.js build cache
        if: github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
