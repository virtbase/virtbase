name: novnc-proxy image

# One workflow, three ways in:
#
#   pull_request   build the image, push nothing - proves the Dockerfile works
#   push to main   publish `edge` and `sha-<short>`, so unreleased changes can
#                  be pulled before a release exists
#   workflow_call  `release.yml` hands over a version: publish `X.Y.Z`, `X.Y`,
#                  `X` and `latest`, and attach the binary to the GitHub release
#
# The proxy's tests and typecheck run first, in a job without write access,
# so nothing is published from a commit that fails them.

on:
  pull_request:
    paths: &paths
      - apps/novnc-proxy/**
      # Compiled into the executable.
      - packages/utils/**
      - packages/validators/**
      - bun.lock
      - package.json
      - .dockerignore
      - .github/workflows/novnc-proxy.yml
      - .github/actions/setup-bun/**
  push:
    branches: [main]
    paths: *paths
  workflow_call:
    inputs:
      version:
        description: The released version, without a leading v.
        type: string
        required: true
      tag:
        description: The git tag of the GitHub release to attach the binary to.
        type: string
        required: true

concurrency:
  group: novnc-proxy-image-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  # A release must never be cancelled half-way through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/novnc-proxy

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun

      - name: Typecheck and test the proxy and what it compiles in
        env:
          CI: "true"
          TURBO_TELEMETRY_DISABLED: "1"
        run: bun turbo run typecheck test --filter=@virtbase/novnc-proxy...

  image:
    needs: verify
    name: Build${{ github.event_name != 'pull_request' && ' and publish' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # upload the binary to a release
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags only when a version was handed over; `edge` and the sha tag
      # only for pushes to main. Neither for pull requests, which push nothing.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=edge,branch=main,enable=${{ github.event_name == 'push' }}
            type=sha,format=short,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=novnc-proxy
            org.opencontainers.image.description=Bridges noVNC browser consoles to Proxmox VE

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/novnc-proxy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=novnc-proxy
          cache-to: type=gha,scope=novnc-proxy,mode=max

      - name: Attest the image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The `binary` stage of the same Dockerfile, so the attached binary is
      # byte-for-byte the one inside the image - and comes from the warm cache.
      - name: Export the binary
        if: inputs.version != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/novnc-proxy/Dockerfile
          platforms: linux/amd64
          target: binary
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=novnc-proxy

      - name: Attach the binary to the release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          name="novnc-proxy-${TAG#novnc-proxy-}-linux-x64"
          mkdir "$name"
          cp dist/novnc-proxy LICENSE.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber

      - name: Attest the binary
        if: inputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: novnc-proxy-*.tar.gz
