name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - bun.lock
      - "**/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Audit the lockfile
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm
