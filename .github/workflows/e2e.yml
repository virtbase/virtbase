name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Deliberately advisory. E2E is the slowest and flakiest layer, and a browser
    # timeout should not block a merge - `ci.yml` is the gate. Remove this once
    # the suite has a track record.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: virtbase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # `packages/db/src/client.ts` speaks the Neon serverless protocol, not
      # plain Postgres, so a bare postgres service is not enough on its own.
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:password@postgres:5432/virtbase
        ports: ["4444:4444"]

    env:
      CI: "true"
      # Not `test`: `packages/auth/env.ts` only accepts development | production,
      # and `client.ts` only routes through the Neon proxy under development.
      NODE_ENV: development
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cookies are scoped to `.virtbase.localhost`, so the suite must drive the
      # real hostnames; `localhost:3000` would never receive the session cookie.
      - name: Map the virtbase hostnames to loopback
        run: |
          sudo tee -a /etc/hosts >/dev/null <<'HOSTS'
          127.0.0.1 virtbase.localhost
          127.0.0.1 app.virtbase.localhost
          127.0.0.1 admin.virtbase.localhost
          127.0.0.1 api.virtbase.localhost
          127.0.0.1 db.localtest.me
          HOSTS

      # `packages/db`'s scripts run through `bun --env-file ../../.env`, so the
      # file has to exist. CONFIG_ENCRYPTION_KEY is left out on purpose: without
      # it the registry falls back to DisabledConfigSource and every integration
      # reports as unavailable, so no third-party credentials are needed.
      - name: Write the environment file
        run: |
          cat > .env <<'ENVFILE'
          DATABASE_URL=postgresql://postgres:password@db.localtest.me:5432/virtbase
          NEXT_PUBLIC_APP_NAME=Virtbase
          NEXT_PUBLIC_APP_DOMAIN=virtbase.com
          BETTER_AUTH_SECRET=e2e-only-secret-not-used-outside-ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_00000000000000000000000000
          ENVFILE

      - name: Run migrations
        run: bun db:migrate

      # Playwright's own docs advise against caching browser binaries: restoring
      # the cache costs about as much as downloading them.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright
        run: bun run test:e2e

      # `playwright-report/` embeds the trace, video and screenshot for every
      # failure, so it is self-contained. `test-results/` is kept alongside it
      # for anyone who wants the raw trace.zip without unpacking the report.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # GitHub serves artifacts as a zip and will not render HTML in the browser,
      # so say out loud how to actually look at a failure.
      - name: Explain how to open the report
        if: ${{ failure() }}
        run: |
          {
            echo "## Playwright failed"
            echo
            echo "Download the \`playwright-report\` artifact from this run, then:"
            echo
            echo '```bash'
            echo "unzip playwright-report.zip -d playwright-report"
            echo "bunx playwright show-report playwright-report/playwright-report"
            echo '```'
            echo
            echo "Each failure carries a video and a trace. Open a trace on its own with"
            echo "\`bunx playwright show-trace <path>/trace.zip\`, or drag it onto <https://trace.playwright.dev>."
          } >> "$GITHUB_STEP_SUMMARY"
