name: Set up Bun
description: Installs the Bun version pinned in package.json and the workspace dependencies.

inputs:
  remote-cache:
    description: Connect turbo to the Vercel Remote Cache through OIDC. The job needs `id-token write`.
    default: "false"

runs:
  using: composite
  steps:
    - name: Connect the Turborepo Remote Cache
      if: inputs.remote-cache == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
      continue-on-error: true
      uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
      with:
        team: bw-edv

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Restore the bun install cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-install-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Save the bun install cache
      if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
