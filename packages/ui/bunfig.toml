[test]

# Register happy-dom and Testing Library cleanup for this package only. The root
# bunfig deliberately does not do this: `GlobalRegistrator` replaces globals such
# as `fetch`, which breaks the suites that install their own `fetch` mock.
preload = ["@virtbase/test-utils/preload"]

# The DOM preload and the render helper are harness, not this package's
# code, but they land in its coverage report because it imports them.
coveragePathIgnorePatterns = ["../test-utils/src/**"]
